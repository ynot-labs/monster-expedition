name: Signed demo release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    env:
      SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Require signing credentials
        run: |
          test -n "$SIGNING_IDENTITY"
          test -n "$APPLE_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_APP_PASSWORD"
      - name: Install dependencies
        run: npm ci
      - name: Verify source
        run: npm run check
      - name: Build signed app and DMG
        run: |
          npm run package:app
          npm run package:dmg
          npm run notarize
          codesign --verify --deep --strict "build/Monster Expedition.app"
      - name: Render public marketplace manifest
        run: node scripts/render-marketplace.mjs "${{ github.repository }}" "${{ github.ref_name }}"
      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "build/Monster-Expedition.dmg" \
            "release/marketplace.json" \
            --generate-notes
